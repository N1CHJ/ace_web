<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Athlete Training</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
        .container { display: flex; flex-direction: column; gap: 1rem; }
        select, input, button { padding: 10px; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        
        .btn-demo { background-color: #28a745; font-weight: bold; margin-bottom: 15px; }
        .btn-demo:hover { background-color: #218838; }

        .status { margin-top: 1rem; font-weight: bold; color: #555; }
        .tabs { display: flex; gap: 10px; margin-bottom: 1rem; }
        .tab { padding: 8px 16px; background: #eee; cursor: pointer; border-radius: 4px; }
        .tab.active { background: #333; color: white; }
        
        .hidden { display: none; }
        #customInputContainer { border-left: 3px solid #007bff; padding-left: 10px; margin-top: -10px; }
        
        /* --- NEW VIDEO GRID STYLES --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .video-card {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .video-card h4 { margin: 0 0 10px 0; font-size: 0.9rem; color: #666; }
        .video-card video { width: 100%; border-radius: 4px; aspect-ratio: 9/16; background: #000; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .score-good { color: green; font-weight: bold; }
        .score-bad { color: red; font-weight: bold; }
        
        .options-row { display: flex; gap: 15px; align-items: center; }
        .checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🏋️ ACE Coach</h1>
    
    <button onclick="runDemo()" class="btn-demo">▶ Run Demo</button>

    <div class="tabs">
        <div class="tab active" onclick="setTask('analyze', this)">Analyze Form</div>
        <div class="tab" onclick="setTask('ingest_reference', this)">Admin Ingest</div>
    </div>

    <div class="container">
        <select id="exerciseName" onchange="checkCustomOption(this)">
            <option>Loading sports...</option>
        </select>
        
        <div id="customInputContainer" class="hidden">
            <input type="text" id="customSportName" placeholder="Type new sport name (e.g. Cricket Bowl)">
        </div>
        
        <div class="options-row">
            <input type="file" id="videoFile" accept="video/*">
            
            <label class="checkbox-label">
                <input type="checkbox" id="chkOverlay"> 
                Generate Overlay?
            </label>
        </div>

        <button onclick="startProcessing()">Run Processing</button>
    </div>

    <div id="status" class="status"></div>
    
    <div id="video-results"></div>
    
    <div id="ai-feedback"></div>

    <div id="stats-output"></div>

    <script src="script.js"></script>
</body>
</html>
